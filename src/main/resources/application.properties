# --- Database -----------------------------------------------------------------
# The password accepts either the new SPRING_DATASOURCE_PASSWORD or the legacy
# NEON_DB_PASSWORD still used by the current deployment, so renaming the
# variable cannot break a running environment.
# If the password contains a '#', wrap the whole value in single quotes,
# otherwise java.util.Properties reads the '#' as a comment and truncates it.
# The URL must carry tcpKeepAlive=true so the JDBC socket sends TCP keepalive
# probes; without them an intermediary can silently drop an idle connection and
# the first query on it fails with "This connection has been closed".
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-quiet-wildflower-b26hdfbb-pooler.c-6.eu-central-1.aws.neon.tech/neondb?sslmode=require&tcpKeepAlive=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${NEON_DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver
# Pin the dialect instead of letting Hibernate auto-detect it. Detection needs a
# live JDBC round trip during context refresh, so a Neon cold start that outlives
# the Hikari connection-timeout aborts startup with "Unable to determine Dialect
# without JDBC metadata" -- and Hibernate reports that same error even when the
# real fault is just a slow handshake, which makes it look like a config bug.
# database-platform is the Spring Boot 3 property for this; the equivalent
# spring.jpa.properties.hibernate.dialect passthrough is not also set, as the two
# would just say the same thing twice. The test suite runs H2 and therefore
# overrides this back to H2Dialect, see IntegrationTest.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# --- HikariCP connection pool -------------------------------------------------
# Neon's serverless Postgres scales compute to zero and reaps idle TCP sessions
# after roughly 2-5 minutes. Hikari's defaults assume a long-lived server:
# max-lifetime is 30 minutes and keepalive-time is disabled, so the pool happily
# hands a socket that Neon already closed to the next request, which surfaces as
# "PgConnection ... This connection has been closed" and a 500 to the browser.
#
# The fix is to make the pool's lifecycle strictly shorter than Neon's idle
# reaper, and to prove liveness before a connection is reused.
#
# max-lifetime: retire every connection after 1 minute. Neon's idle reaper can
# fire as early as ~2 minutes, so the pool's ceiling has to sit below that floor
# or Neon closes the socket first and Hikari only discovers it at retirement
# time, logging "Failed to validate connection ... This connection has been
# closed" (measured with a 2.5-minute value: exactly that warning appeared).
# Must stay above keepalive-time, and Hikari rejects anything under 30s.
# The cost is a TCP+TLS handshake per pooled connection per minute, which is
# why minimum-idle is kept low below.
spring.datasource.hikari.max-lifetime=60000

# idle-timeout: only meaningful when minimum-idle is below maximum-pool-size.
# With the default minimum-idle == maximum-pool-size Hikari pins every
# connection open and never applies this, so it is set together with an explicit
# minimum-idle below to let genuinely unused connections drain.
# Must also stay below max-lifetime: Hikari silently disables the setting and
# resets it to 0 if idle-timeout is within 1s of or above max-lifetime, so the
# previous 100000 was quietly ignored once max-lifetime dropped to 60000.
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.minimum-idle=2

# keepalive-time: ping a pooled connection that has been idle for 30 seconds,
# which is well inside Neon's reaper, so the socket is proven alive before the
# idle window can close it. Hikari rejects a value below 30s.
spring.datasource.hikari.keepalive-time=30000

# connection-test-query: run a round trip on checkout so a socket killed while
# the connection sat idle is discarded and replaced instead of being handed to
# a request. Must be a trivial query. Note the pgjdbc driver also implements
# Connection.isValid(), which Hikari prefers when this is left unset; setting
# this switches validation to explicit SQL, which is marginally more expensive
# but is database-agnostic and easy to reason about.
spring.datasource.hikari.connection-test-query=SELECT 1

# validation-timeout: cap the checkout validation at 3s so a black-holed socket
# (dropped without an RST) fails fast into pool replacement rather than holding a
# request thread until connection-timeout elapses. Must stay below
# connection-timeout.
spring.datasource.hikari.validation-timeout=3000

# connection-timeout: 60s, not the 30s default. Neon scales to zero, so the
# first connection after an idle period pays a cold start that has been
# measured at over 10s and close to 30s. A shorter ceiling aborts that very
# connection during startup and the context then fails with
# "SSL error: Read timed out" before serving a single request.
spring.datasource.hikari.connection-timeout=60000

# --- Security -----------------------------------------------------------------
# app.jwt.expiration binds to java.time.Duration, so it needs a unit-qualified
# value ("24h", "86400s", "PT24H"). A bare integer is read as SECONDS, which
# would make a millisecond count 1000x too large, so no *_MS variable is used.
app.jwt.secret=${APP_JWT_SECRET:${JWT_SECRET}}
app.jwt.expiration=${APP_JWT_EXPIRATION:24h}

# --- CORS ---------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
