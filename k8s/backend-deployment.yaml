apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-workspace-backend
  labels:
    app: team-workspace
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: team-workspace
      component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: team-workspace
        component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/adambilhaj/team-workspace-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: team-workspace-secrets
                  key: spring-datasource-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: team-workspace-secrets
                  key: spring-datasource-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: team-workspace-secrets
                  key: spring-datasource-password
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: team-workspace-secrets
                  key: app-jwt-secret
            - name: APP_JWT_EXPIRATION
              value: "24h"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://app.example.com"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: team-workspace-backend
  labels:
    app: team-workspace
    component: backend
spec:
  type: ClusterIP
  selector:
    app: team-workspace
    component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP