apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-workspace-frontend
  labels:
    app: team-workspace
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: team-workspace
      component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: team-workspace
        component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/adambilhaj/team-workspace-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            # Public values must match the values used when building the image.
            # Change them with Docker build args, not only here.
            - name: NEXT_PUBLIC_API_BASE_URL
              value: "https://api.example.com"
            - name: NEXT_PUBLIC_WS_URL
              value: "https://api.example.com/ws"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: team-workspace-frontend
  labels:
    app: team-workspace
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: team-workspace
    component: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP