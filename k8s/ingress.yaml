apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: team-workspace-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - app.example.com
      secretName: team-workspace-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: team-workspace-backend
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: team-workspace-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: team-workspace-frontend
                port:
                  number: 3000