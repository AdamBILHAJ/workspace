spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-quiet-wildflower-b26hdfbb-pooler.c-6.eu-central-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${NEON_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:1h}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
